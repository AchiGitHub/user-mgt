# fly.toml app configuration file generated for lifestyle-service on 2024-02-05T08:18:43+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "lifestyle-service"
primary_region = "sin"

[build]
  image = "kavidockerdev/lifestyle-fitness:1.50"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
