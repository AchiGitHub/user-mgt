# fly.toml app configuration file generated for lifestyle-service on 2024-10-02T20:23:39+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lifestyle-service'
primary_region = 'sin'

[build]
  image = 'kavidockerdev/lifestyle-fitness:2.01.2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
